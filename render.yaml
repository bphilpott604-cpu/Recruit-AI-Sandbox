services:
  - type: web
    name: gym-tv-slideshow-manager
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        value: CHANGE_ME
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    disk:
      name: slideshow-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
