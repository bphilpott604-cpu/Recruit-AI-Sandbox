services:
  - type: web
    name: gym-tv-slideshow-manager
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
    disk:
      name: slideshow-data
      mountPath: /app/data
      sizeGB: 1
